<title>정민규 · 김가은 결혼합니다</title>

<style>
:root{--bg:#fff;--fg:#000;--mute:#777;--line:#d9d9d9;--soft:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--soft);color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif;font-weight:300;line-height:1.9;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
.wrap{max-width:430px;margin:0 auto;background:var(--bg);overflow:hidden}
section{padding:84px 32px;text-align:center;position:relative}
section+section::before{content:"";position:absolute;top:0;left:32px;right:32px;height:1px;background:var(--line)}
.intro+section::before{content:"";position:absolute;top:0;left:32px;right:32px;height:1px;background:var(--line)}
.serif{font-family:"Noto Serif KR",serif}
.en{font-size:11px;letter-spacing:.32em;color:var(--mute);text-transform:uppercase;margin:0 0 14px}
h2{font-family:"Noto Serif KR",serif;font-weight:400;font-size:20px;letter-spacing:.12em;margin:0 0 32px}
p{margin:0}
.mute{color:var(--mute)}
.fade{opacity:0;transform:translateY(18px);transition:opacity 1s ease,transform 1s ease}
.fade.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.fade{opacity:1;transform:none;transition:none}}
.photo,.g{display:block;width:100%;object-fit:cover}
.photo{aspect-ratio:3/4}
.photo.wide{aspect-ratio:3/2}
.g{aspect-ratio:1/1}
.ph{background:linear-gradient(135deg,#d6d6d6,#8f8f8f);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.25em}
.top{padding:44px 32px 36px;text-align:center}
.top .d{font-family:"Noto Serif KR",serif;font-size:30px;letter-spacing:.04em;line-height:1.4}
.top .w{font-family:"Noto Serif KR",serif;font-size:13px;letter-spacing:.3em;color:var(--mute)}
.intro{padding:44px 32px 84px;text-align:center}
.names{font-family:"Noto Serif KR",serif;font-size:20px;letter-spacing:.14em;margin-bottom:14px}
.greet p{font-family:"Noto Serif KR",serif;font-size:15px;line-height:2.2}
.rule{width:56px;height:1px;background:var(--line);margin:36px auto}
.fam{font-family:"Noto Serif KR",serif;font-size:15px;line-height:2.1}
.fam .m{color:var(--mute);font-size:13px;margin:0 4px}
.fam b{font-weight:600}
.date-big{font-family:"Noto Serif KR",serif;font-size:17px;line-height:2}
.cal{margin:32px auto 0;max-width:320px;display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;font-size:13px}
.cal .h{color:var(--mute);font-size:11px;padding-bottom:8px}
.cal span{height:34px;line-height:34px}
.cal .on{background:var(--fg);color:var(--bg);border-radius:50%;width:34px;margin:0 auto;font-weight:400}
.grid{pointer-events:none;user-select:none;-webkit-user-select:none}
.grow{display:flex;gap:4px;margin-bottom:4px}
.grow .g{min-width:0;height:auto}
.map{aspect-ratio:3/2;margin:28px 0 14px}
.btns{display:flex;gap:8px}
.btn{flex:1;display:block;border:1px solid var(--fg);background:none;color:var(--fg);padding:11px 0;font:inherit;font-size:13px;letter-spacing:.04em;cursor:pointer;text-decoration:none;line-height:1.6;text-align:center}
.btn.fill{background:var(--fg);color:var(--bg)}
.blk{text-align:left;margin-top:28px;font-size:14px}
.blk h4{margin:0 0 10px;font-family:"Noto Serif KR",serif;font-weight:400;font-size:15px}
.list{list-style:none;padding:0;margin:0}
.list li{padding-left:14px;position:relative;margin-bottom:6px}
.list li::before{content:"·";position:absolute;left:0}
.acc{border-top:1px solid var(--line);text-align:left}
.acc:last-of-type{border-bottom:1px solid var(--line)}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:var(--fg);font:inherit;font-family:"Noto Serif KR",serif;font-size:15px;padding:20px 4px;cursor:pointer}
.acc>button b{font-weight:300;font-size:20px;transition:transform .3s}
.acc.open>button b{transform:rotate(45deg)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.acc.open .acc-body{grid-template-rows:1fr}
.acc-in{overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px;border-top:1px dashed var(--line);font-size:14px}
.row small{display:block;font-size:11px;color:var(--mute);letter-spacing:.1em}
.row .btn{flex:none;padding:7px 14px;font-size:12px}
.acc-in .row:last-child{margin-bottom:12px}
.who{display:flex;align-items:center;gap:10px;margin-top:14px}
.who span{flex:0 0 96px;font-family:"Noto Serif KR",serif;font-size:14px;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:11px 22px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:90}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* 인트로 */
.splash{position:fixed;inset:0;z-index:50;background:#111;color:#fff;transition:opacity .7s}
.splash.out{opacity:0;pointer-events:none}
.splash .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1);opacity:.8}
.slides{position:absolute;inset:0;background:#111}
.slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity 1.2s ease,transform 7s linear}
.slides img.on{opacity:1;transform:scale(1)}
.splash .skip{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));right:20px;background:rgba(0,0,0,.6);color:#fff;border:0;padding:10px 18px;font:inherit;font-size:14px;cursor:pointer}
.splash .big{position:absolute;left:24px;right:24px;bottom:calc(104px + env(safe-area-inset-bottom,0px));font-family:"Noto Serif KR",serif;font-size:clamp(38px,12.5vw,54px);line-height:1.12;text-shadow:0 2px 16px rgba(0,0,0,.35);transition:opacity .5s}
.splash .sub{text-shadow:0 1px 10px rgba(0,0,0,.4);position:absolute;left:24px;right:24px;bottom:calc(52px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;font-size:12px;letter-spacing:.3em}
/* 참석 팝업 */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:430px;background:var(--bg);border-radius:24px 24px 0 0;padding:30px 28px calc(30px + env(safe-area-inset-bottom,0px));text-align:center;position:relative;max-height:92vh;overflow:auto;font-size:14px}
.sheet h3{font-family:"Noto Serif KR",serif;font-weight:400;font-size:18px;margin:8px 0 18px}
.sheet .x{position:absolute;top:12px;right:18px;background:none;border:0;font-size:30px;line-height:1;color:var(--fg);cursor:pointer}
.sheet .meta{text-align:left;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 4px;margin:22px 0}
.acts{display:flex;gap:10px;align-items:center}
.acts .no{flex:0 0 auto;background:none;border:0;color:var(--mute);font:inherit;font-size:13px;cursor:pointer;padding:0 8px}
.acts .btn{padding:16px 0}
.sheet label{display:block;text-align:left;font-size:12px;color:var(--mute);margin:14px 0 4px}
.sheet input,.sheet select{width:100%;padding:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:15px;border-radius:0}
#p2{display:none}
.sheet.form #p1{display:none}
.sheet.form #p2{display:block}
#sp{display:none!important}
</style>
</head>
<body class="lock">
<div class="wrap" id="app"></div>
<div class="splash" id="splash">
  <div class="slides" id="slides"></div>
  <button class="skip" id="skip" type="button">SKIP &rarr;</button>
  <div class="big" id="sp"></div>
  <div class="sub"><span>WEDDING</span><span>INVITATION</span></div>
</div>
<div class="sheet-bg" id="sheetbg">
  <div class="sheet" id="sheet">
    <button class="x" type="button" data-close>&times;</button>
    <div id="p1"></div>
    <div id="p2">
      <h3>참석 의사 전달</h3>
      <label>구분</label><select id="rs"><option value="groom">신랑측</option><option value="bride">신부측</option></select>
      <label>성함</label><input id="rn" placeholder="성함을 입력해 주세요" autocomplete="off">
      <label>참석 여부</label><select id="ra"><option>참석</option><option>불참</option></select>
      <label>참석 인원 (본인 포함)</label><input id="rc" type="number" min="1" value="1" inputmode="numeric">
      <div class="acts" style="margin-top:24px"><button class="btn fill" type="button" id="rsend" style="padding:16px 0">참석 의사 전달하기</button></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

const dow = new Date(Y, M - 1, D).getDay();
const dateKo = `${Y}년 ${M}월 ${D}일 ${wd[dow]}요일`;

  <p class="mute" style="font-size:14px;margin-bottom:28px">참석이 어려우신 분들을 위해<br>계좌번호를 기재하였습니다.<br>너그러운 마음으로 양해 부탁드립니다.</p>
  ${acc("신랑측 계좌번호", C.accounts.groom)}${acc("신부측 계좌번호", C.accounts.bride)}
</section>
<section class="fade"><p class="en">Thank you</p><h2>감사합니다</h2>
  <p class="serif" style="font-size:15px;line-height:2.2">${br(C.closing)}</p>
  <div style="margin-top:36px">${call("신랑 " + C.couple.groom.name, C.contact.groom)}${call("신부 " + C.couple.bride.name, C.contact.bride)}</div>
</section>`;

/* 인트로 */
const $ = id => document.getElementById(id);
const list = (C.images.splash && C.images.splash.length ? C.images.splash : [C.images.main]).filter(Boolean);
$("slides").innerHTML = list.map((u, i) => `<img src="${u}" alt="" style="object-position:${(C.splash.pos || [])[i] || "50% 50%"}">`).join("");
const slides = [...$("slides").children];
const sp = $("sp"), tx = C.splash.texts; let ti = 0, timer, killer;
function tick() { sp.style.opacity = 0; setTimeout(() => { sp.textContent = tx[ti++ % tx.length]; sp.style.opacity = 1; slides.forEach((el, k) => el.classList.toggle("on", k === (ti - 1) % slides.length)); }, 450); }
tick(); timer = setInterval(tick, 2800);
function hidden() { try { return localStorage.getItem("rsvpHide") === "1"; } catch (_) { return false; } }
function closeSplash() {
  clearInterval(timer); clearTimeout(killer);
  $("splash").classList.add("out"); document.body.classList.remove("lock");
  setTimeout(() => { $("splash").remove(); if (!hidden()) openSheet(false); }, 700);
}
$("skip").addEventListener("click", closeSplash);
killer = setTimeout(closeSplash, list.length * 2800 - 100);   // 사진 수만큼 한 번씩 보여준 뒤 종료

/* 참석 팝업 */
function submitRsvp(name) {
  const url = C.rsvp.scriptUrl;
  if (!url || url.indexOf("http") !== 0) { toast("아직 시트가 연결되지 않았습니다"); return; }
  const body = new URLSearchParams({
    side: $("rs").selectedOptions[0].text, name: name, attend: $("ra").value, count: $("rc").value
  });
  const btn = $("rsend"); btn.disabled = true; btn.textContent = "전달 중…";
  const done = () => { btn.disabled = false; btn.textContent = "참석 의사 전달하기"; };
  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("시간 초과")), 15000));
  Promise.race([fetch(url, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString() }).then(r => r.text()), timeout])
    .then(t => {
      if (String(t).trim() !== "ok") throw new Error("서버 응답 오류");
      toast("참석 의사가 전달되었습니다. 감사합니다"); closeSheet(); $("rn").value = "";
    })
    .catch(err => { console.error(err); toast("전달 실패: " + (err && err.message ? err.message : "알 수 없음")); })
    .finally(done);
}
$("p1").innerHTML = `<h3>참석 의사 전달</h3>
  <p class="mute" style="font-size:13px;letter-spacing:-.02em">특별한 날 축하의 마음으로 참석해주시는<br>모든 분들을 한 분 한 분 더욱 귀하게 모실 수 있도록,<br>아래 버튼으로 신랑 &amp; 신부에게 꼭 참석여부 전달을<br>부탁드립니다.</p>
  <div class="meta">${dateKo} ${timeShort}<br>${W.venue} ${W.hall}<br><span class="mute">${W.address}</span></div>
  <div class="acts"><button class="no" type="button" id="nomore">다시 보지 않기</button><a class="btn" data-form href="#">참석의사 전달하기</a></div>`;
function openSheet(form) { $("sheet").classList.toggle("form", !!form); $("sheetbg").classList.add("on"); }
function closeSheet() { $("sheetbg").classList.remove("on"); }
$("sheetbg").addEventListener("click", e => { if (e.target.id === "sheetbg" || e.target.closest("[data-close]")) closeSheet(); });
$("nomore").addEventListener("click", () => { try { localStorage.setItem("rsvpHide", "1"); } catch (_) {} closeSheet(); });
$("rsend").addEventListener("click", () => {
  const name = $("rn").value.trim();
  if (!name) { toast("성함을 입력해 주세요"); return; }
  const n = parseInt($("rc").value, 10);
  if (!n || n < 1) { toast("참석 인원을 확인해 주세요"); return; }
  submitRsvp(name);
});

/* 아코디언 + 복사 + 버튼 */
const toastEl = $("toast"); let tt;
function toast(m) { toastEl.textContent = m; toastEl.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove("show"), 1800); }
document.addEventListener("click", async e => {
  if (e.target.closest("[data-form],[data-rsvp]")) { e.preventDefault(); openSheet(true); return; }
  
  const h = e.target.closest(".acc>button");
  if (h) { h.setAttribute("aria-expanded", h.parentElement.classList.toggle("open")); return; }
  const c = e.target.closest("[data-copy]");
  if (!c) return;
  const t = c.dataset.copy;
  try { await navigator.clipboard.writeText(t); }
  catch (_) { const x = document.createElement("textarea"); x.value = t; x.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(x); x.select(); try { document.execCommand("copy"); } catch (_) {} x.remove(); }
  toast("복사되었습니다");
});

/* 페이드인 */
const els = document.querySelectorAll(".fade");
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: .12 });
  els.forEach(el => io.observe(el));
} else els.forEach(el => el.classList.add("in"));
</script>
</body>
</html>
